<div id="study-list"></div>

<button class="fab" id="study-fab" aria-label="Add study item">+</button>

<div class="sheet-backdrop" id="study-sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 id="study-sheet-title">Add Study Item</h2>
      <button class="btn-ghost" id="study-sheet-close">Close</button>
    </div>
    <form id="study-form">
      <input type="hidden" id="study-id">

      <div class="field" id="study-field-topic">
        <label>Topic</label>
        <input type="text" id="study-topic" placeholder="e.g. Normalization in DBMS">
        <div class="error-text">Please enter a topic</div>
      </div>

      <label>Image <span style="opacity:0.6;">(optional)</span></label>
      <input type="file" id="study-image" accept="image/*">
      <img id="study-image-preview" class="study-thumb hidden">
      <button type="button" class="btn-ghost hidden" id="study-image-remove" style="margin-top:8px;">Remove image</button>

      <label>File <span style="opacity:0.6;">(optional, any type)</span></label>
      <input type="file" id="study-file">
      <div id="study-file-preview" class="hidden"><span class="file-pill" id="study-file-pill"></span></div>
      <button type="button" class="btn-ghost hidden" id="study-file-remove" style="margin-top:8px;">Remove file</button>

      <button type="submit" class="btn">Save Study Item</button>
    </form>
  </div>
</div>
