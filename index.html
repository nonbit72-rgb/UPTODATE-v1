<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<title>UPTODATE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="app-header">
  <h1><span class="brand-dot"></span><span id="page-title">Transactions</span></h1>
  <button id="settings-btn" aria-label="Settings">⚙</button>
</header>

<main id="content">
  <div class="empty-state"><div class="icon">⏳</div>Loading…</div>
</main>

<nav id="bottom-nav">
  <button class="nav-item" data-tab="transactions">
    <span class="nav-icon">₹</span>Transactions
  </button>
  <button class="nav-item" data-tab="attendance">
    <span class="nav-icon">📋</span>Attendance
  </button>
  <button class="nav-item" data-tab="study">
    <span class="nav-icon">📚</span>Study
  </button>
</nav>

<!-- Settings sheet: manage remembered lecture / teacher names -->
<div class="sheet-backdrop" id="settings-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Settings</h2>
      <button class="btn-ghost" id="settings-close">Close</button>
    </div>
    <div class="section-title">Remembered lectures</div>
    <div id="lecture-mgmt-list"></div>
    <div class="section-title" style="margin-top:22px;">Remembered teachers</div>
    <div id="teacher-mgmt-list"></div>
  </div>
</div>

<div id="toast"></div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/transactions.js"></script>
<script src="js/attendance.js"></script>
<script src="js/study.js"></script>
<script src="js/main.js"></script>
</body>
</html>
